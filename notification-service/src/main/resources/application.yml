server:
  port: ${PORT:3003}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ridehail_notification}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    # service/mailTemplate.service.js's send_email() hardcoded a live Gmail SMTP account +
    # app-password here - flagged for credential rotation, never copied verbatim. Source the
    # (rotated) credentials from env at deploy time; MAIL_USERNAME/MAIL_PASSWORD are intentionally
    # left blank by default rather than defaulting to the leaked value.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

ridehail:
  env: ${NODE_ENV:development}
  enc-secret: ${ENC_SECRET:}
  jwt:
    user-secret: ${USER_JWT_SECRET:}
    driver-secret: ${DRIVER_JWT_SECRET:}
    admin-secret: ${ADMIN_JWT_SECRET:}
    in-app-secret: ${IN_APP_SECRET:}
    other-secret: ${OTHER_SECRET:}
    other-secret-exp-in-sec: ${OTHER_SECRET_EXP_IN_SEC:3600}
  services:
    common-url: ${COMMON_SERVICE_URL:http://localhost:3004/common-apis}
    user-url: ${USER_SERVICE_URL:http://localhost:3002/user-apis}
    driver-url: ${DRIVER_SERVICE_URL:http://localhost:3001/driver-apis}
    admin-url: ${ADMIN_SERVICE_URL:http://localhost:3005/admin-apis}
    ride-url: ${RIDE_SERVICE_URL:http://localhost:3006/ride-apis}
    vehicle-url: ${VEHICLE_SERVICE_URL:http://localhost:3006/vehicle-apis}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:3003/notification-apis}
    socket-url: ${SOCKET_SERVICE_URL:http://localhost:8000/socket-apis}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    messaging-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  mail:
    # config/email.config.js's Emailconfig.emailGateway.fromMail (CONFIG.EMAIL_USER) - kept
    # separate from spring.mail.username/password (the SMTP transport's own auth) exactly like the
    # original, where the "from" address (zeptomail account) and the SMTP auth account (Gmail)
    # were two independent, mismatched values.
    from-address: ${EMAIL_USER:}
  firebase:
    # Replaces the committed notification-service/firebase-credentials.json (flagged for rotation).
    # Point this at a mounted service-account key file; when blank, push sending is disabled and
    # send-push-notification returns a "not configured" error while the rest of the service works.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:${GOOGLE_APPLICATION_CREDENTIALS:}}
